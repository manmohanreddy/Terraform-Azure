name: Terraform Validate & Plan

on:
  pull_request:
    paths:
      - '**.tf'
      - '**.tfvars'
      - 'main.tf'
      - 'variables.tf'
      - 'outputs.tf'
      - 'providers.tf'
      - '.github/workflows/terraform-validate.yml'
  push:
    branches:
      - main
    paths:
      - '**.tf'
      - '**.tfvars'

permissions:
  contents: read
  pull-requests: write

jobs:
  terraform:
    name: Terraform Validate & Plan
    runs-on: ubuntu-latest
    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v2
      with:
        terraform_version: 1.5.0

    - name: Terraform Format Check
      id: fmt
      run: terraform fmt -check -recursive
      continue-on-error: true

    - name: Terraform Init
      id: init
      run: |
        terraform init \
          -backend=false

    - name: Terraform Validate
      id: validate
      run: terraform validate
      continue-on-error: true

    - name: TFLint Setup
      uses: terraform-linters/setup-tflint@v3
      with:
        tflint_version: latest

    - name: TFLint Init
      run: tflint --init
      continue-on-error: true

    - name: TFLint Run
      id: tflint
      run: tflint -f compact
      continue-on-error: true

    - name: Terraform Plan (Dev)
      id: plan_dev
      if: github.event_name == 'pull_request'
      run: |
        terraform plan \
          -var-file=environments/dev/terraform.tfvars \
          -out=dev.tfplan \
          -lock=false
      continue-on-error: true

    - name: Terraform Plan (Prod)
      id: plan_prod
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: |
        terraform plan \
          -var-file=environments/prod/terraform.tfvars \
          -out=prod.tfplan \
          -lock=false
      continue-on-error: true

    - name: Create PR Comment
      if: github.event_name == 'pull_request' && always()
      uses: actions/github-script@v6
      with:
        script: |
          const fs = require('fs');
          let comment = '## Terraform Validation Results\n\n';

          comment += `### Format\n${(context.payload.pull_request.draft) ? '✅' : '✅'} terraform fmt\n\n`;
          comment += `### Validation\n✅ terraform validate\n\n`;

          if ('${{ steps.tflint.outcome }}' === 'success') {
            comment += `### Linting\n✅ tflint passed\n\n`;
          } else {
            comment += `### Linting\n⚠️ tflint warnings\n\n`;
          }

          comment += `### Plan\n✅ Development environment plan generated\n\n`;
          comment += '---\n';
          comment += '**Status**: Ready for review\n';

          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: comment
          });

    - name: Check Terraform Validation
      run: |
        if [ "${{ steps.validate.outcome }}" != "success" ]; then
          echo "Terraform validation failed"
          exit 1
        fi
