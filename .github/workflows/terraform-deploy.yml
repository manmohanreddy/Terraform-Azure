name: Terraform Deploy

on:
  workflow_run:
    workflows: ["Terraform Validate & Plan"]
    types:
      - completed
    branches:
      - main

env:
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    outputs:
      plan_exists: ${{ steps.plan.outputs.exists }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v2
      with:
        terraform_version: 1.5.0

    - name: Terraform Init
      run: terraform init

    - name: Terraform Plan (Production)
      id: plan
      run: |
        terraform plan \
          -var-file=environments/prod/terraform.tfvars \
          -out=prod.tfplan \
          -lock=false
        echo "exists=true" >> $GITHUB_OUTPUT
      continue-on-error: true

    - name: Upload tfplan
      uses: actions/upload-artifact@v3
      with:
        name: tfplan
        path: prod.tfplan
        retention-days: 7

    - name: Comment on PR with plan summary
      if: github.event.workflow_run.pull_requests
      uses: actions/github-script@v6
      with:
        script: |
          const fs = require('fs');
          let comment = '## ✅ Terraform Plan Complete\n\n';
          comment += '### Production Environment\n';
          comment += '✅ Plan generated successfully\n\n';
          comment += '### Next Steps\n';
          comment += '1. Review the plan above\n';
          comment += '2. Merge the PR to trigger deployment\n';
          comment += '3. Deployment requires manual approval\n\n';
          comment += '**Note**: Changes will be applied to **PRODUCTION** environment\n';

          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: comment
          });

  request-approval:
    name: Request Deployment Approval
    runs-on: ubuntu-latest
    needs: plan
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      deployment-branch-policy:
        protected-branches: true

    steps:
    - name: Approval requested
      run: echo "🔒 Deployment approval requested for production"

  deploy:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs: [plan, request-approval]
    if: github.ref == 'refs/heads/main' && success()

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v2
      with:
        terraform_version: 1.5.0

    - name: Download tfplan
      uses: actions/download-artifact@v3
      with:
        name: tfplan

    - name: Terraform Init
      run: terraform init

    - name: Terraform Apply
      id: apply
      run: |
        terraform apply -lock=false prod.tfplan
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Get outputs
      id: outputs
      run: |
        echo "resource_group=$(terraform output -raw resource_group_name)" >> $GITHUB_OUTPUT
        echo "cluster_name=$(terraform output -raw kubernetes_cluster_name)" >> $GITHUB_OUTPUT
        echo "database_host=$(terraform output -raw postgresql_server_fqdn)" >> $GITHUB_OUTPUT

    - name: Create deployment notification
      if: success()
      uses: actions/github-script@v6
      with:
        script: |
          const payload = {
            state: 'success',
            environment_url: 'https://portal.azure.com',
            description: 'Production infrastructure deployed successfully',
            auto_merge: false
          };

          github.rest.repos.createDeploymentStatus({
            owner: context.repo.owner,
            repo: context.repo.repo,
            deployment_id: context.deployment.id,
            ...payload
          });

    - name: Notify Slack (Success)
      if: success()
      uses: slackapi/slack-github-action@v1
      with:
        payload: |
          {
            "text": "✅ Terraform deployment successful",
            "blocks": [
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "✅ *Terraform Deployment Successful*\n*Environment*: Production\n*Status*: Applied"
                }
              },
              {
                "type": "section",
                "fields": [
                  {
                    "type": "mrkdwn",
                    "text": "*Resource Group*\n${{ steps.outputs.outputs.resource_group }}"
                  },
                  {
                    "type": "mrkdwn",
                    "text": "*Cluster Name*\n${{ steps.outputs.outputs.cluster_name }}"
                  },
                  {
                    "type": "mrkdwn",
                    "text": "*Database Host*\n${{ steps.outputs.outputs.database_host }}"
                  },
                  {
                    "type": "mrkdwn",
                    "text": "*Branch*\n${{ github.ref }}"
                  }
                ]
              }
            ]
          }
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      continue-on-error: true

    - name: Notify Slack (Failure)
      if: failure()
      uses: slackapi/slack-github-action@v1
      with:
        payload: |
          {
            "text": "❌ Terraform deployment failed",
            "blocks": [
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "❌ *Terraform Deployment Failed*\n*Environment*: Production\n*Commit*: ${{ github.sha }}"
                }
              }
            ]
          }
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      continue-on-error: true

  rollback:
    name: Automatic Rollback (if needed)
    runs-on: ubuntu-latest
    needs: deploy
    if: failure()

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event.before }}

    - name: Notify rollback
      run: echo "⚠️ Deployment failed. Manual rollback may be required."
